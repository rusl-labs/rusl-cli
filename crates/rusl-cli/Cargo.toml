[package]
name = "rusl"
version = "0.6.2"
edition = "2024"
description = "The Rusl schema package manager CLI."
homepage = "https://github.com/rusl-labs/rusl-cli"
repository = "https://github.com/rusl-labs/rusl-cli"
license = "Apache-2.0"
readme = "../../README.md"
publish = false

[package.metadata.dist]
dist = true

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive", "env"] }
colored = "3.1.1"
dialoguer = "0.12.0"
indicatif = "0.18.4"
rand = "0.10.0"
reqwest = { version = "0.13.2", features = ["json"] }
rusl-app = { path = "../rusl-app" }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.50.0", features = ["full"] }
toml = "1.1.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
turbomcp = { version = "3.1.5", default-features = false, features = ["minimal"] }
webbrowser = "1.2.0"

[dev-dependencies]
axum = "0.8.4"
serde_json = "1.0.149"
serial_test = "3"
tempfile = "3"
