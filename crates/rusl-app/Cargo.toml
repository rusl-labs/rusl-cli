[package]
name = "rusl-app"
version = "0.5.0"
edition = "2024"
description = "Shared application logic for the Rusl schema package manager."
homepage = "https://github.com/rusl-labs/rusl-cli"
repository = "https://github.com/rusl-labs/rusl-cli"
license = "Apache-2.0"
publish = false

[package.metadata.dist]
dist = false

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive"] }
directories = "6.0.0"
hex = "0.4.3"
indicatif = "0.18.4"
pubgrub = "0.4.0"
rand = "0.10.0"
rusl-api-client = { path = "../rusl-api-client" }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
semver = "1.0.27"
sha2 = "0.11.0"
tempfile = "3"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
toml = "1.1.0"
toml_edit = "0.25.8"
tracing = "0.1.44"
webbrowser = "1.2.0"
jsonschema = "0.46.5"

[dev-dependencies]
axum = "0.8.4"
serial_test = "3"
