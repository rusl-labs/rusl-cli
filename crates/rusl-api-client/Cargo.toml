[package]
name = "rusl-api-client"
version = "0.6.6"
edition = "2024"
rust-version = "1.88"
description = "HTTP client boundary for the Rusl schema registry API."
homepage = "https://github.com/rusl-labs/rusl-cli"
repository = "https://github.com/rusl-labs/rusl-cli"
license = "Apache-2.0"
publish = false

[package.metadata.dist]
dist = false

[dependencies]
reqwest = { version = "0.13.2", features = ["json"] }
rusl_openapi_client = { package = "rusl-openapi-client", path = "generated" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

[dev-dependencies]
axum = "0.8.4"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
