[package]
name = "rusl-api-client"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.2", features = ["json"] }
rusl_openapi_client = { package = "rusl-openapi-client", path = "generated" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

[dev-dependencies]
axum = "0.8.4"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
